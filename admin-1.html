<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>لوحة إدارة Sunny Store</title>
<style>
body{font-family:Cairo,system-ui,sans-serif;background:#fffdf5;margin:0;padding:16px;color:#2b2618}
.box{max-width:640px;margin:0 auto}
input,select,textarea,button{font:inherit;width:100%;padding:10px;margin:4px 0 10px;border:1px solid #d8cfae;border-radius:10px;box-sizing:border-box}
button{background:#8a6a00;color:#fff;border:0;cursor:pointer;width:auto;padding:10px 16px;margin:0}
button.sec{background:#eee6c8;color:#2b2618}
button.del{background:#b3261e}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border:1px solid #eee6c8;border-radius:12px;padding:10px;margin-bottom:8px}
.row small{color:#777;display:block}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:8px}
.chk input{width:auto;margin:0}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.err{color:#b3261e}
.order-item{display:flex;gap:8px;align-items:center;margin:6px 0}
.order-thumb{width:44px;height:44px;min-width:44px;border-radius:8px;overflow:hidden;background:#fff4c9;display:flex;align-items:center;justify-content:center}
.order-thumb img{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<div class="box">
<h1>لوحة إدارة Sunny Store</h1>
<div id="login">
  <input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="username">
  <input id="pass" type="password" placeholder="كلمة المرور" autocomplete="current-password">
  <button id="loginBtn">تسجيل الدخول</button>
  <p id="err" class="err"></p>
</div>
<div id="panel" hidden>
  <div class="bar"><small id="who"></small><button class="sec" id="logout">خروج</button></div>
  <div class="acts" style="margin-bottom:12px"><button id="tabP">المنتجات</button><button id="tabO" class="sec">الطلبات</button><button id="backupBtn" class="sec">تنزيل نسخة احتياطية</button></div>
  <div id="prodSec">
  <h2 id="formTitle">إضافة منتج</h2>
  <input id="name" placeholder="اسم المنتج">
  <input id="price" type="number" inputmode="numeric" placeholder="السعر بالدينار (أرقام فقط)">
  <select id="cat"></select>
  <textarea id="desc" rows="3" placeholder="الوصف"></textarea>
  <label>صور المنتج (حتى 4، الأولى هي الرئيسية)</label>
  <input id="files" type="file" accept="image/*" multiple>
  <div id="thumbs" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"></div>
  <label class="chk"><input id="hasOpt" type="checkbox"> للمنتج قياسات / خيارات</label>
  <div id="optBox" hidden><input id="optTitle" placeholder="اسم الخيار (مثل: رقم القلم)"><input id="optVals" placeholder="الأرقام مفصولة بفاصلة: 1,2,3,4,5"></div>
  <input id="stock" type="number" inputmode="numeric" placeholder="المخزون (عدد القطع)">
  <input id="sort" type="number" inputmode="numeric" placeholder="الترتيب (الأصغر يظهر أولاً)">
  <select id="status"><option value="active">ظاهر في المتجر</option><option value="unavailable">غير متوفر حاليًا</option><option value="hidden">مخفي</option></select>
  <label class="chk"><input id="feat" type="checkbox"> منتج مميز (يظهر في «الأكثر رواجًا»)</label>
  <div class="acts" style="margin:10px 0"><button id="save">حفظ</button><button class="sec" id="reset">مسح النموذج</button></div>
  <p id="msg"></p>
  <h2>المنتجات</h2>
  <select id="fcat"></select>
  <input id="fq" placeholder="بحث بالاسم داخل القسم">
  <select id="fst"><option value="">الكل</option><option value="active">الظاهر</option><option value="unavailable">غير المتوفر</option><option value="hidden">المخفي</option></select>
  <div id="list"></div>
  </div>
  <div id="ordSec" hidden>
    <h2>الطلبات</h2>
    <select id="ofst"><option value="">كل الحالات</option><option value="new">جديد</option><option value="contacted">تم التواصل</option><option value="preparing">قيد التجهيز</option><option value="shipped">تم الشحن</option><option value="done">مكتمل</option><option value="cancelled">ملغي</option></select>
    <button class="sec" id="oref">تحديث</button>
    <div id="olist" style="margin-top:10px"></div>
  </div>
</div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {getFirestore,collection,getDocs,getDoc,doc,setDoc,addDoc,deleteDoc,updateDoc,query,where,orderBy,limit,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
const CATS={brooches:'بروشات','special-necklaces':'قلادات اختصاص',accessories:'إكسسوارات',sets:'أطقم',pens:'أقلام','table-lamps':'تيبل لامب',stationery:'قرطاسية',medals:'مداليات'};
const PST={active:'ظاهر',unavailable:'غير متوفر',hidden:'مخفي'};
$('cat').innerHTML='<option value="">— اختر القسم —</option>'+Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
let editing=null,old={},imgs=[],removed=[],cache=[];
$('fcat').innerHTML=$('cat').innerHTML;$('fcat').onchange=()=>load();$('fq').oninput=()=>draw();$('fst').onchange=()=>draw();
const norm=d=>{const x={};Object.entries(d).forEach(([k,v])=>x[k.trim().toLowerCase()]=v);return x};
const loadImg=f=>new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=no;i.src=u});
const shrink=(i,max,q)=>{const r=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*r);c.height=Math.round(i.height*r);c.getContext('2d').drawImage(i,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)};
async function mkBig(f){const i=await loadImg(f);let q=.8,d=shrink(i,1000,q);while(d.length>200000&&q>.4){q-=.1;d=shrink(i,1000,q)}return d}
const thumbOf=d=>new Promise(ok=>{const i=new Image();i.onload=()=>ok(shrink(i,400,.7));i.src=d});
function renderThumbs(){const b=$('thumbs');b.innerHTML='';imgs.forEach((m,k)=>{const w=document.createElement('div'),i=document.createElement('img'),x=document.createElement('button');i.src=m.big;i.style.cssText='width:80px;height:80px;object-fit:cover;border-radius:8px;display:block';x.textContent='×';x.className='del';x.style.cssText='padding:2px 10px;margin-top:4px';x.onclick=()=>{if(m.id)removed.push(m.id);imgs.splice(k,1);renderThumbs()};w.append(i,x);b.append(w)})}
$('files').onchange=async e=>{for(const f of e.target.files){if(imgs.length>=4){$('msg').textContent='الحد الأقصى 4 صور.';break}try{imgs.push({big:await mkBig(f)})}catch(x){$('msg').textContent='تعذر قراءة إحدى الصور.'}}e.target.value='';renderThumbs()};
$('hasOpt').onchange=()=>{$('optBox').hidden=!$('hasOpt').checked};
onAuthStateChanged(auth,u=>{$('login').hidden=!!u;$('panel').hidden=!u;if(u){$('who').textContent=u.email;load();}});
$('loginBtn').onclick=async()=>{$('err').textContent='';try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('pass').value);}catch(e){$('err').textContent='تعذر تسجيل الدخول، تأكد من البريد وكلمة المرور.';}};
$('logout').onclick=()=>signOut(auth);
$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click();});
function resetForm(){
  editing=null;old={};imgs=[];removed=[];renderThumbs();
  ['name','price','desc','stock','sort','optTitle','optVals'].forEach(i=>$(i).value='');
  $('status').value='active';$('feat').checked=false;$('hasOpt').checked=false;$('optBox').hidden=true;$('cat').selectedIndex=0;
  $('formTitle').textContent='إضافة منتج';
}
$('reset').onclick=()=>{resetForm();$('msg').textContent='';};
async function load(){
  const c=$('fcat').value;
  if(!c){cache=[];return draw()}
  $('list').textContent='جارٍ التحميل...';
  const s=await getDocs(query(collection(db,'products'),where('categoryId','==',c)));
  cache=[...s.docs];draw();
}
function draw(){
  const box=$('list');box.innerHTML='';
  if(!$('fcat').value){box.textContent='اختر قسمًا لعرض منتجاته.';return}
  const q=$('fq').value.trim(),st=$('fst').value;
  const rows=cache.filter(d=>{const x=norm(d.data()),status=String(x.status||'').trim().toLowerCase();return (!q||String(x.name||'').includes(q))&&(!st||status===st)});
  rows.sort((a,b)=>Number(norm(a.data()).sortorder||0)-Number(norm(b.data()).sortorder||0)).forEach(d=>{
    const x=norm(d.data()),status=String(x.status||'').trim().toLowerCase();
    const row=document.createElement('div');row.className='row';
    const info=document.createElement('div');
    const t=document.createElement('strong');t.textContent=x.name||'(بدون اسم)';
    const sm=document.createElement('small');
    sm.textContent=`${Number(x.price||0).toLocaleString('en')} د.ع · ${CATS[String(x.categoryid||'').trim()]||'قسم غير معروف'} · ${PST[status]||status||'غير معروف'}`;
    info.append(t,sm);
    const acts=document.createElement('div');acts.className='acts';
    const eb=document.createElement('button');eb.className='sec';eb.textContent='تعديل';
    eb.onclick=async()=>{
      editing=d.id;old={createdAt:x.createdat||null};
      $('name').value=String(x.name||'').trim();$('price').value=x.price??'';
      $('cat').value=String(x.categoryid||'').trim();if($('cat').selectedIndex<0)$('cat').value='';
      $('desc').value=String(x.description||'').trim();
      $('stock').value=x.stock??'';$('sort').value=x.sortorder??'';
      $('status').value=['active','unavailable','hidden'].includes(status)?status:'hidden';
      $('feat').checked=Boolean(x.isfeatured);
      $('hasOpt').checked=Array.isArray(x.options)&&x.options.length>0;$('optBox').hidden=!$('hasOpt').checked;
      $('optTitle').value=x.optiontitle||'';$('optVals').value=(x.options||[]).join(',');
      $('formTitle').textContent='تعديل منتج';window.scrollTo(0,0);
      imgs=[];removed=[];
      for(const iid of (x.imageids||[])){try{const g=await getDoc(doc(db,'images',iid));if(g.exists())imgs.push({id:iid,big:g.data().big})}catch(e){}}
      renderThumbs();
    };
    const db2=document.createElement('button');db2.className='del';db2.textContent='حذف';
    db2.onclick=async()=>{
      if(!confirm('حذف هذا المنتج نهائيًا؟'))return;
      try{for(const iid of (x.imageids||[]))await deleteDoc(doc(db,'images',iid)).catch(()=>{});await deleteDoc(doc(db,'products',d.id));load();}catch(e){$('msg').textContent='تعذر الحذف: '+e.message;}
    };
    acts.append(eb,db2);
    if(x.thumb){const im=document.createElement('img');im.src=x.thumb;im.style.cssText='width:48px;height:48px;object-fit:cover;border-radius:8px';row.append(im)}
    row.append(info,acts);box.append(row);
  });
  if(!rows.length)box.textContent='لا توجد منتجات مطابقة.';
}
const ST={new:'جديد',contacted:'تم التواصل',preparing:'قيد التجهيز',shipped:'تم الشحن',done:'مكتمل',cancelled:'ملغي'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>Number(v||0).toLocaleString('en');
let ords=[],openId='',orderThumbs={};
$('tabP').onclick=()=>{$('prodSec').hidden=false;$('ordSec').hidden=true;$('tabP').className='';$('tabO').className='sec'};
$('tabO').onclick=()=>{$('prodSec').hidden=true;$('ordSec').hidden=false;$('tabP').className='sec';$('tabO').className='';loadOrders()};
$('ofst').onchange=()=>drawOrders();$('oref').onclick=()=>loadOrders();
async function loadOrders(){
  $('olist').textContent='جارٍ التحميل...';
  try{
    const q=await getDocs(query(collection(db,'orders'),orderBy('createdAt','desc'),limit(100)));
    ords=q.docs.map(d=>({id:d.id,o:d.data()}));
    orderThumbs={};
    const ps=await getDocs(collection(db,'products'));
    ps.docs.forEach(d=>{const x=norm(d.data());if(x.thumb)orderThumbs[d.id]=x.thumb});
    drawOrders();
  }catch(e){$('olist').textContent='تعذر تحميل الطلبات: '+e.message}
}
function drawOrders(){
  const f=$('ofst').value,list=ords.filter(x=>!f||x.o.status===f);
  $('olist').innerHTML=list.length?list.map(({id,o})=>{
    const c=o.customer||{},t=o.createdAt&&o.createdAt.toDate?o.createdAt.toDate().toLocaleString('ar-IQ'):'';
    return `<details class="row" style="display:block"${id===openId?' open':''}><summary><strong>#${id.slice(0,6).toUpperCase()}</strong> · ${esc(c.name)} · ${n(o.total)} د.ع · <b>${ST[o.status]||esc(o.status)}</b><small>${t}</small></summary>
<p>الهاتف: <a href="tel:${esc(c.phone)}">${esc(c.phone)}</a><br>المحافظة: ${esc(c.governorate)}<br>العنوان: ${esc(c.address)}${c.notes?'<br>ملاحظات: '+esc(c.notes):''}</p>
<div>${(o.items||[]).map(i=>`<div class="order-item"><div class="order-thumb">${orderThumbs[i.id]?`<img src="${orderThumbs[i.id]}" alt="${esc(i.name)}">`:'☀️'}</div><div>${esc(i.name)}${i.option?' — '+esc(i.option):''} × ${Number(i.qty)} = ${n(Number(i.price)*Number(i.qty))} د.ع</div></div>`).join('')}</div>
<p>المنتجات: ${n(o.subtotal)} · التوصيل: ${n(o.delivery)} · <b>الإجمالي: ${n(o.total)} د.ع</b></p>
<select data-st="${id}">${Object.entries(ST).map(([k,v])=>`<option value="${k}"${k===o.status?' selected':''}>${v}</option>`).join('')}</select>
<button class="del" data-del="${id}">حذف الطلب</button></details>`}).join(''):'لا توجد طلبات.';
}
$('olist').onchange=async e=>{const id=e.target.dataset.st;if(!id)return;openId=id;try{await updateDoc(doc(db,'orders',id),{status:e.target.value});ords.find(x=>x.id===id).o.status=e.target.value;drawOrders()}catch(x){alert('تعذر التحديث: '+x.message)}};
$('olist').onclick=async e=>{const id=e.target.dataset.del;if(!id||!confirm('حذف هذا الطلب نهائيًا؟'))return;try{await deleteDoc(doc(db,'orders',id));ords=ords.filter(x=>x.id!==id);drawOrders()}catch(x){alert('تعذر الحذف: '+x.message)}};

function safeData(v){
  if(v&&typeof v==='object'&&typeof v.toDate==='function'&&'seconds' in v){
    return {__type:'firestore_timestamp',seconds:v.seconds,nanoseconds:v.nanoseconds??0};
  }
  if(Array.isArray(v))return v.map(safeData);
  if(v&&typeof v==='object'){const out={};Object.entries(v).forEach(([k,x])=>out[k]=safeData(x));return out}
  return v;
}
async function backupCollection(name){
  const s=await getDocs(collection(db,name));
  return s.docs.map(d=>({id:d.id,data:safeData(d.data())}));
}
$('backupBtn').onclick=async()=>{
  const b=$('backupBtn');b.disabled=true;b.textContent='جاري تجهيز النسخة...';
  try{
    const [products,images,orders]=await Promise.all([backupCollection('products'),backupCollection('images'),backupCollection('orders')]);
    const payload={format:'sunny-store-backup-v1',createdAt:new Date().toISOString(),project:'sunny-store-iq',products,images,orders};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='sunny-store-backup-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
    alert(`تم تجهيز النسخة الاحتياطية.\nالمنتجات: ${products.length}\nالصور: ${images.length}\nالطلبات: ${orders.length}`);
  }catch(e){alert('تعذر إنشاء النسخة الاحتياطية: '+e.message)}
  b.disabled=false;b.textContent='تنزيل نسخة احتياطية';
};

$('save').onclick=async()=>{
  const data={name:$('name').value.trim(),price:Number($('price').value)||0,categoryId:$('cat').value,description:$('desc').value.trim(),stock:Number($('stock').value)||0,status:$('status').value,isFeatured:$('feat').checked,sortOrder:Number($('sort').value)||0};
  if(!data.name){$('msg').textContent='اكتب اسم المنتج.';return;}
  if(!data.categoryId){$('msg').textContent='اختر القسم.';return;}
  $('save').disabled=true;$('msg').textContent='جارٍ الحفظ...';
  try{
    const ids=[];
    for(const m of imgs){if(!m.id){const r=await addDoc(collection(db,'images'),{big:m.big,createdAt:serverTimestamp()});m.id=r.id}ids.push(m.id)}
    data.imageIds=ids;data.thumb=imgs.length?await thumbOf(imgs[0].big):'';
    const ho=$('hasOpt').checked;
    data.optionTitle=ho?$('optTitle').value.trim():'';
    data.options=ho?$('optVals').value.split(/[,،]/).map(s=>s.trim()).filter(Boolean):[];
    if(editing)await setDoc(doc(db,'products',editing),{...data,createdAt:old.createdAt||serverTimestamp()});
    else await addDoc(collection(db,'products'),{...data,createdAt:serverTimestamp()});
    for(const iid of removed)await deleteDoc(doc(db,'images',iid)).catch(()=>{});
    $('fcat').value=data.categoryId;resetForm();$('msg').textContent='تم الحفظ ✓';load();
  }catch(e){$('msg').textContent='تعذر الحفظ: '+e.message;}
  $('save').disabled=false;
};
</script>
</body>
</html>
