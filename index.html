<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sunny Store — متجر البروشات الأكبر في العراق." />
  <title>Sunny Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="toast" class="toast" aria-live="polite"></div>

  <aside id="sideMenu" class="side-menu" aria-hidden="true">
    <div class="side-head">
      <div class="brand small-brand"><span class="sun-mark">☀</span><span>Sunny Store</span></div>
      <button class="icon-btn" data-close-menu aria-label="إغلاق">×</button>
    </div>
    <nav class="side-nav">
      <button data-route="home">الرئيسية</button>
      <button data-route="categories">الأقسام</button>
      <button data-open-search>البحث عن منتج</button>
      <button data-route="how-to-order">كيف أطلب؟</button>
      <button data-open-cart>السلة <span class="menu-count" id="menuCartCount">0</span></button>
    </nav>
    <div class="side-note">متجر البروشات الأكبر في العراق.</div>
  </aside>
  <div id="overlay" class="overlay" hidden></div>

  <header class="site-header">
    <div class="header-inner">
      <button id="menuBtn" class="icon-btn menu-btn" aria-label="فتح القائمة">☰</button>
      <a href="#/" class="brand" aria-label="Sunny Store الرئيسية">
        <span class="logo-slot"><span class="sun-mark">☀</span></span>
        <span>Sunny Store</span>
      </a>
      <div class="header-actions">
        <button class="search-toggle icon-btn" data-open-search aria-label="بحث">⌕</button>
        <button class="cart-btn" data-open-cart aria-label="السلة">🛒 <span id="cartCount">0</span></button>
      </div>
    </div>
  </header>

  <main id="app" class="app"></main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div><div class="brand footer-brand"><span class="sun-mark">☀</span> Sunny Store</div><p>خليك أكثر إشراقًا.</p></div>
      <div><strong>روابط</strong><button data-route="home">الرئيسية</button><button data-route="categories">الأقسام</button><button data-route="how-to-order">كيف أطلب؟</button></div>
      <div><strong>التوصيل</strong><p>5,000 د.ع داخل العراق</p></div>
    </div>
    <div class="copyright">© Sunny Store</div>
  </footer>

  <div id="searchPanel" class="modal" hidden>
    <div class="modal-card search-card">
      <button class="modal-close" data-close-search>×</button>
      <h2>البحث عن منتج</h2>
      <div class="search-box large"><span>⌕</span><input id="globalSearch" type="search" placeholder="اكتب اسم المنتج..." autocomplete="off"></div>
      <div id="searchResults" class="search-results"></div>
    </div>
  </div>

  <div id="cartPanel" class="drawer" hidden>
    <div class="drawer-card">
      <div class="drawer-head"><h2>سلة التسوق</h2><button class="modal-close" data-close-cart>×</button></div>
      <div id="cartItems" class="cart-items"></div>
      <div id="cartSummary" class="cart-summary"></div>
      <button id="checkoutBtn" class="primary-btn full">إتمام الطلب</button>
    </div>
  </div>

  <div id="checkoutPanel" class="modal" hidden>
    <div class="modal-card checkout-card">
      <button class="modal-close" data-close-checkout>×</button>
      <h2>إتمام الطلب</h2>
      <p class="muted">أدخل معلوماتك بدقة. سنتواصل معك عبر واتساب لتأكيد الطلب.</p>
      <form id="checkoutForm">
        <label>الاسم الكامل<input name="name" required placeholder="الاسم الكامل"></label>
        <label>المحافظة<select name="governorate" required><option>بغداد</option><option>النجف</option><option>بابل</option><option>البصرة</option><option>واسط</option><option>ذي قار</option><option>ميسان</option><option>المثنى</option><option>القادسية</option><option>كربلاء</option><option>الأنبار</option><option>ديالى</option><option>صلاح الدين</option><option>كركوك</option><option>نينوى</option><option>أربيل</option><option>السليمانية</option><option>دهوك</option></select></label>
        <label>العنوان<input name="address" required placeholder="المنطقة، الشارع، أقرب نقطة دالة"></label>
        <label>رقم هاتف يحتوي واتساب فعّال<input name="phone" required inputmode="tel" placeholder="مثال: 07XXXXXXXXX"></label>
        <label>ملاحظات إضافية <span class="optional">اختياري</span><textarea name="notes" rows="3" placeholder="أي ملاحظة تخص الطلب"></textarea></label>
        <div id="checkoutTotal" class="checkout-total"></div>
        <button class="primary-btn full" type="submit">إرسال الطلب</button>
      </form>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
